minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        exclude: ^\.devcontainer/

  # codespell
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog,DEPENDEES",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h",
          ]

  # typos
  - repo: https://gitcode.com/gh_mirrors/ty/typos
    rev: v1.32.0
    hooks:
      - id: typos
        args: ["--force-exclude", "--config", "pre-commit/typos.toml"]

  #--------------- C++ 核心检查 ---------------------------------------------
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        entry: git-clang-format
        args: [--binary, clang-format, -f]
        exclude: \.(build|test|third-party)
        # git-clang-format 使用固定的 .git/clang-format-index 临时索引，
        # 并发执行会互相竞争导致 "Unable to create ... .lock" 报错。
        require_serial: true
   # --------------- C++ 静态检查（本地 clang-tidy）------------------
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (本地venv)
        entry: pre-commit/clang-tidy-wrapper.sh
        language: system
        pass_filenames: true
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        # 单测仅在 build_ut(LLDB_INCLUDE_TESTS=ON) 的编译库中，产品库 build/
        # 不含 unittests，clang-tidy 无法解析其依赖，故排除单测目录。
        exclude: ^lldb/unittests/
        args: [
          "--quiet",
          "--config-file=lldb/.clang-tidy",
          "-p",
          "build",
          "--checks=-llvm-header-guard,-llvm-else-after-return,-llvm-qualified-auto,-misc-unconventional-assign-operator,-clang-diagnostic-error",
          "--extra-arg=-Wno-unknown-warning-option",
          "--extra-arg=-Wno-unknown-argument",
        ]
  # -------------------------- Gitleaks 本地离线二进制扫描 --------------------------
  - repo: local
    hooks:
      - id: gitleaks-offline-scan
        name: Gitleaks Secret Scan(Local Binary)
        entry: gitleaks
        language: system
        pass_filenames: true
        args:
          - protect
          - --verbose
          - --redact
          - --config=pre-commit/.gitleaks.toml
        stages: [pre-commit]
